[package]
name = "rinux-lib"
description = "Rust port of the Linux kernel's lib/ directory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "rinux_lib"

[lints]
workspace = true

[features]
# Allocating helpers (kasprintf, match_strdup, bitmap_alloc). The kernel
# enables this and routes `alloc` through its kmalloc-backed global allocator.
# Host builds leave it off so the default crate stays allocation-free.
alloc = []
