[workspace]
resolver = "3"
members = ["lib"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/bahdahshin/linux"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# The CRC tests run a bit-at-a-time reference CRC over megabytes of data.
[profile.test]
opt-level = 1
