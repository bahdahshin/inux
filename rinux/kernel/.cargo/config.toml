[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    # Lay the image out with our linker script, loaded at 1 MiB.
    "-C", "link-arg=-Tlinker.ld",
    # A plain static executable: GRUB loads it at its link address.
    "-C", "relocation-model=static",
    "-C", "force-frame-pointers=yes",
]
